name: Build Nexus

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  NEXUS_CLIENT_TOKEN: ${{ secrets.NEXUS_CLIENT_TOKEN }}

jobs:

  macos-arm64:
    name: macOS Apple Silicon
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nexus-gui/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install dependencies
        working-directory: nexus-gui
        run: npm ci

      - name: Build Nexus
        working-directory: nexus-gui
        run: npm run tauri build -- --target aarch64-apple-darwin --bundles dmg --ci

      - name: Rename DMG
        run: |
          cp nexus-gui/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg Nexus-macos-arm64.dmg

      - name: Upload release
        uses: softprops/action-gh-release@v2
        with:
          files: Nexus-macos-arm64.dmg


  macos-intel:
    name: macOS Intel
    runs-on: macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nexus-gui/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Install dependencies
        working-directory: nexus-gui
        run: npm ci

      - name: Build Nexus
        working-directory: nexus-gui
        run: npm run tauri build -- --target x86_64-apple-darwin --bundles dmg --ci

      - name: Rename DMG
        run: |
          cp nexus-gui/src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg Nexus-macos-intel.dmg

      - name: Upload release
        uses: softprops/action-gh-release@v2
        with:
          files: Nexus-macos-intel.dmg


  windows:
    name: Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nexus-gui/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        working-directory: nexus-gui
        run: npm ci

      - name: Build Nexus
        working-directory: nexus-gui
        run: npm run tauri build -- --target x86_64-pc-windows-msvc --bundles nsis --ci

      - name: Rename installer
        shell: pwsh
        run: |
          Copy-Item `
            nexus-gui/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe `
            Nexus-Windows-x64-Setup.exe

      - name: Upload release
        uses: softprops/action-gh-release@v2
        with:
          files: Nexus-Windows-x64-Setup.exe


  linux:
    name: Linux x64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nexus-gui/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install dependencies
        working-directory: nexus-gui
        run: npm ci

      - name: Build Nexus
        working-directory: nexus-gui
        run: npm run tauri build -- --target x86_64-unknown-linux-gnu --bundles deb --ci

      - name: Rename DEB
        run: |
          cp nexus-gui/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb Nexus-linux-x64-1.1.6.deb

      - name: Upload release
        uses: softprops/action-gh-release@v2
        with:
          files: Nexus-linux-x64-1.1.6.deb
