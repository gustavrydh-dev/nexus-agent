[package]
name = "nexus-gui"
version = "0.1.0"
description = "Nexus AI Computer Agent"
authors = ["Nexus Solutions"]
edition = "2021"

[lib]
name = "nexus_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
